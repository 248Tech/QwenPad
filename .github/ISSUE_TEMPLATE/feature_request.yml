name: Feature request
description: Suggest an idea for QwenPad
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like QwenPad to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The problem it solves or the workflow it improves.
